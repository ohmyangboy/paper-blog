<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" style="border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Far Mountain Gradient -->
    <linearGradient id="farMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.6" />
    </linearGradient>
    <!-- Mid Mountain Gradient -->
    <linearGradient id="midMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <!-- Near Hill Gradient -->
    <linearGradient id="nearHill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Sun Glow -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="380" rx="8" fill="url(#skyGrad)" />

  <!-- Morning Sun -->
  <circle cx="380" cy="140" r="46" fill="url(#sunGrad)" filter="url(#sunGlow)" opacity="0.9" />

  <!-- Far Snow Peaks -->
  <polygon points="120,380 230,150 280,240 380,120 490,380" fill="url(#farMountain)" />
  <polygon points="230,150 210,190 250,190" fill="#ffffff" opacity="0.85" />
  <polygon points="380,120 355,170 405,170" fill="#ffffff" opacity="0.85" />

  <!-- Mid Range Mountain Ridge -->
  <path d="M 0,380 L 0,260 Q 90,190 190,230 T 380,210 T 600,240 L 600,380 Z" fill="url(#midMountain)" opacity="0.85" />

  <!-- Foreground Hills & Pine Silhouette -->
  <path d="M 0,380 L 0,300 Q 140,240 280,310 T 600,280 L 600,380 Z" fill="url(#nearHill)" />

  <!-- Pine Trees Group -->
  <g fill="#1e3a8a" opacity="0.9">
    <polygon points="80,340 70,365 90,365" />
    <polygon points="80,325 73,345 87,345" />
    <polygon points="95,335 86,360 104,360" />
    <polygon points="95,320 89,340 101,340" />
    <polygon points="110,345 103,370 117,370" />
    <polygon points="480,325 470,355 490,355" />
    <polygon points="480,310 473,330 487,330" />
    <polygon points="500,335 492,365 508,365" />
  </g>

  <!-- Birds in the sky -->
  <path d="M 210,100 Q 216,94 222,100 Q 228,94 234,100" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 240,115 Q 244,110 248,115 Q 252,110 256,115" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

  <!-- Caption Label Badge -->
  <rect x="20" y="20" width="130" height="26" rx="13" fill="#ffffff" opacity="0.85" />
  <text x="32" y="37" fill="#0f172a" font-size="12" font-weight="600" letter-spacing="0.02em">🏔️ 晨曦雪山</text>
</svg>