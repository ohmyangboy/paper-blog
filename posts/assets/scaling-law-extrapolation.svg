    <circle cx="90.5" cy="108.0" r="3.5" class="dot-gold" />
    <circle cx="97.2" cy="101.4" r="3.5" class="dot-gold" />
    <circle cx="104.0" cy="99.8" r="3.5" class="dot-gold" />
