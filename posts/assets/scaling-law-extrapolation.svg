    <circle cx="151.2" cy="59.3" r="3.5" class="dot-crimson" />
    <circle cx="158.0" cy="52.7" r="3.5" class="dot-crimson" />
    <circle cx="164.8" cy="49.2" r="3.5" class="dot-crimson" />

