<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .axis { stroke: #71717a; stroke-width: 1.1; }
      .grid { stroke: #f4f4f5; stroke-width: 0.8; stroke-dasharray: 2,2; }
      .card-bg { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
      .text-sub { fill: #71717a; font-size: 9.5px; }
      .title { fill: #18181b; font-size: 11.5px; font-weight: 600; text-anchor: middle; }
      .fit-line { stroke: #d97706; stroke-width: 1.6; }
      .dot-gold { fill: #f59e0b; }
      .dot-crimson { fill: #be123c; }
      .dot-charcoal { fill: #27272a; }
      .dot-amber { fill: #b45309; }
    </style>
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.1" />
    </filter>
  </defs>

