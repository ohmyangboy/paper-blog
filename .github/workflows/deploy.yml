name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Paper
        run: python -m pip install .

      - name: Build SSG
        env:
          PAPER_HOME: ${{ runner.temp }}/paper
        run: |
          python paper.py link "$GITHUB_WORKSPACE/posts"
          python - <<'PY'
          import os
          from paper_runtime.core import load_config, normalize_git_remote, save_config

          config = load_config()
          remote = normalize_git_remote(os.environ["GITHUB_REPOSITORY"])
          if remote is None:
              raise RuntimeError("无法从 GITHUB_REPOSITORY 推导 Pages 地址")
          save_config(config, git_remote=remote.ssh_url)
          PY
          python paper.py build
          mkdir -p out
          cp -R "$PAPER_HOME/site/out/." out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
